name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3' 'ruff>=0.12,<1' 'pyright>=1.1.403,<2'
      - name: Install shell static analysis
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Validate shell entrypoints
        run: |
          bash -n orchestrator/run_sol58_pes.sh orchestrator/run_moe_full_agent.sh orchestrator/pes.sh
          shellcheck -S warning \
            orchestrator/run_sol58_pes.sh \
            orchestrator/run_moe_full_agent.sh \
            orchestrator/pes.sh \
            orchestrator/ensure_loongflow_compat.sh
      - name: Run static analysis
        run: |
          ruff check \
            orchestrator/sol58_pes \
            orchestrator/loongflow_compat \
            orchestrator/run_manifest.py \
            tools/evolution_db.py
          ruff format --check \
            orchestrator/sol58_pes \
            orchestrator/loongflow_compat \
            orchestrator/run_manifest.py \
            tools/evolution_db.py
          pyright
      - name: Run core unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tools
        run: |
          python -m pytest -q \
            tools/test_evolution_db.py \
            orchestrator/sol58_pes/test_eval_program_sol58.py \
            orchestrator/sol58_pes/test_ncu_summary.py \
            orchestrator/sol58_pes/test_runtime_config.py \
            orchestrator/sol58_pes/test_official_probe.py \
            orchestrator/sol58_pes/test_local_gate.py \
            orchestrator/sol58_pes/test_local_best_store.py \
            orchestrator/sol58_pes/test_official_protocol.py \
            orchestrator/sol58_pes/test_fitness_calibration.py \
            orchestrator/loongflow_compat/test_sitecustomize.py \
            orchestrator/loongflow_compat/test_upstream_contract.py \
            orchestrator/test_run_manifest.py
