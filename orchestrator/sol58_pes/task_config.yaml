# SOL-ExecBench LoongFlow PES configuration rendered from a validated task spec.
workspace_path: "${SOL58_PES_WORKSPACE}"

logger:
  level: "INFO"
  console_logging: true
  file_logging: true
  log_path: "${SOL58_PES_WORKSPACE}/logs"
  filename: "sol58-pes.log"

llm_config:
  url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  model: "${LLM_MODEL}"
  model_provider: "${LLM_PROVIDER}"
  temperature: ${LLM_TEMPERATURE}
  context_length: ${LLM_CONTEXT_LENGTH}
  max_tokens: ${LLM_MAX_TOKENS}
  timeout: ${LLM_TIMEOUT}

planners:
  evolve_planner:
    react_max_steps: 5

executors:
  evolve_executor_react:
    parallel_candidates: 1
    max_rounds: 3
    react_max_steps: 10

  evolve_executor_chat:
    max_rounds: 3

  evolve_executor_fuse:
    max_rounds: 3
    react_max_steps: 10
    score_threshold: ${SOL58_REACT_SCORE_THRESHOLD}

summarizers:
  evolve_summary:
    react_max_steps: 5

evolve:
  task_name: "${ATREX_TASK_NAME}"
  task: |
    Optimize SOL-ExecBench kernel ${SOL58_OFFICIAL_KERNEL_ID}:
    ${SOL58_PROBLEM_SLUG} on ${SOL58_OFFICIAL_GPU_TYPE}.

  planner_name: "evolve_planner"
  executor_name: "evolve_executor_fuse"
  summary_name: "evolve_summary"

  max_iterations: ${SOL58_MAX_ITERATIONS}
  # Official certification remains tied to SOL58_TARGET_SCORE in the evaluator.
  # This sentinel leaves termination to the outer iteration/signal controller.
  target_score: ${SOL58_PES_STOP_SCORE}
  concurrency: ${SOL58_PES_CONCURRENCY}

  # initial_score is intentionally omitted. The LoongFlow runner default is None,
  # which makes PES evaluate initial_kernel.cu before the first Plan step.
  initial_evaluation: ""

  evaluator:
    timeout: ${SOL58_EVAL_TIMEOUT}

  database:
    storage_type: "in_memory"
    num_islands: ${SOL58_NUM_ISLANDS}
    population_size: 100
    elite_archive_size: 50
    use_sampling_weight: true
    sampling_weight_power: ${SOL58_SAMPLING_WEIGHT_POWER}
    exploration_rate: ${SOL58_EXPLORATION_RATE}
    # The Atrex Summary hook interprets this as a global iteration interval,
    # not the upstream per-island-capacity heuristic.
    migration_interval: ${SOL58_ARCHITECTURE_MIGRATION_INTERVAL}
    migration_rate: 0.2
    boltzmann_temperature: 1.0
    feature_bins: 8
    feature_dimensions:
      - "complexity"
      - "diversity"
      - "score"
    feature_scaling_method: "minmax"
    checkpoint_interval: 1
    output_path: "${SOL58_PES_WORKSPACE}/database/checkpoints"
